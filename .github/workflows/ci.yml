name: CI

on:
  push:
    branches: [master, main, prod]
  pull_request:
    branches: [master, main, prod]
  # A mano desde cualquier rama (24-10, Brandon): SÓLO arma la versión con `vercel build`
  # en esta máquina (ubuntu-latest, 16 GB: el repo es público) y la sube como PREVIEW con
  # `--prebuilt`. La máquina de Vercel Hobby (8 GB) muere por memoria armándola.
  # Lint/tests/E2E no corren en este modo: tsc + vitest ya los corre el pre-commit.
  # Lanzar: `gh workflow run ci.yml --ref <rama>` (pasos en docs/runbooks/deploy-rama-a-produccion.md).
  workflow_dispatch:

jobs:
  lint-test-build:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    env:
      # Dummy values so Next.js build doesn't fail on missing env vars
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci_db"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-placeholder"
      # Stripe placeholder: Next 16 hace "collect page data" sobre /api/admin/plan/checkout/stripe-session
      # y stripe.checkout.sessions.create se evalúa en build → Error "Neither apiKey nor authenticator".
      # Una clave sk_test_* dummy permite que la inicialización del SDK no falle.
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder_for_build_only_not_a_real_key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      STRIPE_PRICE_PRO: "price_ci_placeholder"
      STRIPE_PRICE_BUSINESS: "price_ci_placeholder"
      STRIPE_PRICE_ENTERPRISE: "price_ci_placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks-action necesita resolver <base-PR>^..<HEAD> en el scan
          # diff; con shallow clone default (fetch-depth=1) el parent del
          # base SHA no existe → "fatal: ambiguous argument" y CI falla.
          # fetch-depth=0 trae el history completo (clone tarda +5-10s).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # non-blocking: upstream CVEs tracked in TECH-DEBT

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Schema drift check (db:sanity)
        # PENTEST 2026-05-18 Sprint D #4: prevent runtime P2021/P2022.
        # Compara las tablas/columnas del schema.prisma con la DB real.
        # Si una columna está en schema.prisma pero no en la DB (drift por
        # migration sin aplicar) → falla el build. Si la DB tiene columnas
        # que el schema no conoce, solo warn.
        # Solo corre si DATABASE_URL está configurado (skip en forks sin secret).
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            DATABASE_URL="${{ secrets.DATABASE_URL }}" npm run db:sanity
          else
            echo "Skip — DATABASE_URL no configurado en este workflow"
          fi
        continue-on-error: true  # bloqueante = true cuando todos los entornos tengan DATABASE_URL en CI

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Audit 2026-05-17 08-P2-1: gitleaks ahora blocking. Round 28
        # estableció baseline limpio; cualquier secret nuevo debe fallar
        # el CI. Si hay false positives, agregarlos a .gitleaksignore
        # con justificación, no a continue-on-error.

      - name: Lint
        run: npm run lint

      - name: Shadow duplicates audit (non-blocking)
        # Lista archivos .ts/.tsx con mismo basename en rutas distintas.
        # Visto en prod: RecentlyViewed shadowed entre components/ y components/store/
        # causaba que fixes se aplicaran al archivo equivocado.
        # Warning-only hasta tener baseline — subir a exit 1 en una PR dedicada.
        run: node scripts/find-duplicates.mjs
        continue-on-error: true

      - name: Type check (tsc 7 nativo)
        # 2026-09-22: 195,5s con tsc 5.9 → 49,6s en frío con el binario Go. Ver scripts/tsc7.mjs.
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Enforce coverage thresholds
        # Round 28 (DevOps audit P0): antes warning silencioso. Ahora blocking
        # pero los thresholds van alineados con el baseline real del proyecto
        # (ver vitest.config.ts). Bajar coverage por debajo del baseline → CI rojo.
        # Roadmap: subir 5pp por trimestre vía vitest.config.ts.
        run: npx vitest run --coverage --coverage.thresholds.lines=7 --coverage.thresholds.statements=7 --coverage.thresholds.branches=5 --coverage.thresholds.functions=4

      - name: Build
        run: npm run build

      # ── E2E tests selectivos (admin bulk + checkout) ────────────────────
      # Solo specs criticos para no inflar tiempo de CI. Previenen regresion
      # del bug CSRF 2026-04-20 (bulk-clear-images) y del flujo checkout.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: E2E — admin bulk + checkout
        # Round 28 (DevOps audit P0): antes non-blocking. Ahora bloquea PRs.
        # Estos 2 specs cubren CSRF (bug 2026-04-20) y flujo checkout. Baseline
        # verificado verde en round 14 prod build fix. Si vuelve a ponerse
        # rojo, investigar antes que ignorar.
        run: npx playwright test e2e/admin-bulk-images.spec.ts e2e/checkout-multistep.spec.ts --reporter=list

  evals:
    name: Run Evals (28 critical zone tests)
    runs-on: ubuntu-latest
    needs: [lint-test-build]

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci_db"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run evals (checkout + fiado + sunat + multi-tenant + DR)
        run: npx vitest run --config evals/vitest.eval.config.ts

  deploy-preview:
    # Armado `--prebuilt` → PREVIEW. Corre a mano (workflow_dispatch, cualquier rama, sin
    # esperar lint/tests) o en push a master/main con lint-test-build verde.
    # NUNCA `--prod` en este job: la promoción a producción la decide Brandon después de
    # probar el preview (runbook § «Armado en GitHub»).
    name: Armado Vercel → Preview (--prebuilt)
    runs-on: ubuntu-latest
    needs: [lint-test-build]
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      needs.lint-test-build.result == 'success')) }}
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: armado-vercel-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Ids (no son claves; los mismos de .vercel/project.json). Un secreto con ese nombre manda.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_tZ6dsZ6AVoAQ9enqpd4kVRPK' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_J3LW8EWUie3GLvqSdYGVBvcqu7V5' }}
    steps:
      - name: Secreto VERCEL_TOKEN cargado
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Falta el secreto VERCEL_TOKEN::Crear un token en vercel.com/account/settings/tokens (alcance: el equipo dueño del proyecto mercado) y pegarlo en GitHub → Settings → Secrets and variables → Actions → New repository secret, nombre VERCEL_TOKEN. Pasos: docs/runbooks/deploy-rama-a-produccion.md § Armado en GitHub."
            exit 1
          fi
          echo "VERCEL_TOKEN presente · equipo $VERCEL_ORG_ID · proyecto $VERCEL_PROJECT_ID · rama $GITHUB_REF_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Más swap (red de seguridad por si next build pasa los 16 GB)
        continue-on-error: true
        run: |
          sudo fallocate -l 6G /mnt/swap-armado && sudo chmod 600 /mnt/swap-armado
          sudo mkswap /mnt/swap-armado >/dev/null && sudo swapon /mnt/swap-armado
          free -g; df -h / /mnt | tail -2

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment (Preview)
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" || {
            echo "::error title=vercel pull falló::El token no ve el proyecto. Revisar que el token sea de la cuenta/equipo dueño de mercado ($VERCEL_ORG_ID), no de otra cuenta."
            exit 1
          }
          # El repo es PÚBLICO y sus logs también: ocultar todo valor sensible bajado de Vercel.
          node -e '
            const t = require("fs").readFileSync(".vercel/.env.preview.local", "utf8");
            for (const linea of t.split("\n")) {
              const m = linea.match(/^([A-Za-z0-9_]+)="?(.*?)"?$/);
              if (!m) continue;
              const sensible = /SECRET|TOKEN|KEY|PASS|URL|DSN|PRIVATE|AUTH/i.test(m[1]) || m[2].length >= 20;
              if (!sensible) continue;
              for (const parte of m[2].split("\\n")) if (parte.trim().length >= 6) console.log("::add-mask::" + parte.trim());
            }'
          for v in DATABASE_URL DIRECT_URL AUTH_SECRET; do
            grep -q "^$v=" .vercel/.env.preview.local || echo "::warning title=Falta $v en Preview::validateEnv() corta el arranque sin $v (runbook §3)."
          done

      - name: Build with Vercel (en esta máquina)
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (Preview, --prebuilt)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: success()
        run: |
          {
            echo "### Preview armado en GitHub"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Rama: \`$GITHUB_REF_NAME\` · commit \`${GITHUB_SHA::9}\`"
            echo "- Es PREVIEW: no toca producción. Probarlo (runbook §6.4) antes de decidir el pase."
          } >> "$GITHUB_STEP_SUMMARY"
