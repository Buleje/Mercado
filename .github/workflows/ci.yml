name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-test-build:
    name: Lint → Test → Build
    runs-on: ubuntu-latest

    env:
      # Dummy values so Next.js build doesn't fail on missing env vars
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci_db"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # non-blocking: upstream CVEs tracked in TECH-DEBT

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # non-blocking inicial — convertir a blocking tras 1 semana de baseline limpio
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Shadow duplicates audit (non-blocking)
        # Lista archivos .ts/.tsx con mismo basename en rutas distintas.
        # Visto en prod: RecentlyViewed shadowed entre components/ y components/store/
        # causaba que fixes se aplicaran al archivo equivocado.
        # Warning-only hasta tener baseline — subir a exit 1 en una PR dedicada.
        run: node scripts/find-duplicates.mjs
        continue-on-error: true

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Enforce coverage thresholds
        # Round 28 (DevOps audit P0): antes era warning silencioso. Ahora
        # blocking — un PR que baja coverage debajo del threshold falla CI.
        run: npx vitest run --coverage --coverage.thresholds.lines=80 --coverage.thresholds.statements=80 --coverage.thresholds.branches=70 --coverage.thresholds.functions=75

      - name: Build
        run: npm run build

      # ── E2E tests selectivos (admin bulk + checkout) ────────────────────
      # Solo specs criticos para no inflar tiempo de CI. Previenen regresion
      # del bug CSRF 2026-04-20 (bulk-clear-images) y del flujo checkout.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: E2E — admin bulk + checkout
        # Round 28 (DevOps audit P0): antes non-blocking. Ahora bloquea PRs.
        # Estos 2 specs cubren CSRF (bug 2026-04-20) y flujo checkout. Baseline
        # verificado verde en round 14 prod build fix. Si vuelve a ponerse
        # rojo, investigar antes que ignorar.
        run: npx playwright test e2e/admin-bulk-images.spec.ts e2e/checkout-multistep.spec.ts --reporter=list

  evals:
    name: Run Evals (28 critical zone tests)
    runs-on: ubuntu-latest
    needs: [lint-test-build]

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci_db"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run evals (checkout + fiado + sunat + multi-tenant + DR)
        run: npx vitest run --config evals/vitest.eval.config.ts

  deploy-preview:
    name: Deploy Preview → Vercel
    runs-on: ubuntu-latest
    needs: [lint-test-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Comment Deploy URL
        if: success()
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
