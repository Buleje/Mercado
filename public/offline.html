<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexion — Buleje</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #1f2937; }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; color: #2d6a4f; }
    p { font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem; line-height: 1.6; }
    button { background: #2d6a4f; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #245a42; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Audit 2026-05-17 07-P2-3: reemplazado emoji 📡 por SVG inline
         (regla bsm: no emojis genéricos en UI). Lucide CloudOff stroke 1.5. -->
    <div class="icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20"/>
        <path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/>
        <path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>
      </svg>
    </div>
    <h1>Sin conexion</h1>
    <p>No tienes conexion a internet. Verifica tu WiFi o datos moviles e intenta de nuevo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
