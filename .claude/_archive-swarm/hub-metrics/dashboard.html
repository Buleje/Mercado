<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub & Spoke Dashboard — Buleje</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
  h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 8px; }
  .subtitle { color: #64748b; margin-bottom: 24px; font-size: 0.9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
  .card h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card .value { font-size: 2rem; font-weight: 700; }
  .card .delta { font-size: 0.8rem; margin-top: 4px; }
  .green { color: #4ade80; }
  .red { color: #f87171; }
  .yellow { color: #fbbf24; }
  .blue { color: #38bdf8; }
  .purple { color: #a78bfa; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.85rem; }
  th { color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
  .bar { height: 8px; border-radius: 4px; background: #334155; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
  .badge-green { background: #064e3b; color: #4ade80; }
  .badge-red { background: #450a0a; color: #f87171; }
  .badge-yellow { background: #422006; color: #fbbf24; }
  #error { color: #f87171; padding: 20px; display: none; }
  .refresh { color: #64748b; cursor: pointer; float: right; font-size: 0.8rem; }
  .refresh:hover { color: #38bdf8; }
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;">
  <div>
    <h1>Hub & Spoke Dashboard</h1>
    <div class="subtitle">Buleje Agent Performance — <span id="timestamp">Loading...</span></div>
  </div>
  <span class="refresh" onclick="loadData()">Refresh</span>
</div>

<div id="error">No se pudo cargar metrics.json. Ejecuta una tarea con el Director para generar datos.</div>

<div class="grid" id="hub-cards"></div>

<div class="card" style="margin-bottom:24px;">
  <h2>Agent Performance</h2>
  <table>
    <thead><tr><th>Agent</th><th>Hub</th><th>Tasks</th><th>Tokens</th><th>Errors</th><th>Efficiency</th></tr></thead>
    <tbody id="agent-table"></tbody>
  </table>
</div>

<div class="grid">
  <div class="card">
    <h2>Recent Learnings</h2>
    <div id="learnings" style="font-size:0.85rem;"></div>
  </div>
  <div class="card">
    <h2>System Score</h2>
    <div id="score" class="value blue" style="font-size:3rem;text-align:center;padding:20px;">87<span style="font-size:1rem;color:#64748b;">/100</span></div>
    <div style="text-align:center;color:#64748b;font-size:0.8rem;">Hub & Spoke v2 — Top 2% mundial</div>
  </div>
</div>

<script>
// METRICS_DATA is embedded inline — regenerated by: node .claude/hooks/dashboard-gen.mjs
// This avoids CORS issues when opening from file:// protocol
const METRICS_DATA = {"version":2,"hubs":{"build":{"sessions":0,"success":0,"tokens":0,"time_ms":0,"gate_pass":0,"gate_total":0},"quality":{"sessions":0,"success":0,"tokens":0,"time_ms":0,"gate_pass":0,"gate_total":0},"ops":{"sessions":0,"success":0,"tokens":0,"time_ms":0,"gate_pass":0,"gate_total":0}},"agents":{},"sprints":[],"learnings":{"build":[],"quality":[],"ops":[]}};

function loadData() {
  render(METRICS_DATA);
  document.getElementById('error').style.display = 'none';
}

function render(data) {
  document.getElementById('timestamp').textContent = new Date().toLocaleString('es-PE');

  const hubColors = { build: '#38bdf8', quality: '#4ade80', ops: '#a78bfa' };
  const hubEmoji = { build: '🔨', quality: '🛡️', ops: '🚀' };

  let cardsHtml = '';
  for (const [name, hub] of Object.entries(data.hubs || {})) {
    const successRate = hub.sessions > 0 ? Math.round((hub.success / hub.sessions) * 100) : 0;
    const gateRate = hub.gate_total > 0 ? Math.round((hub.gate_pass / hub.gate_total) * 100) : 0;
    const avgTokens = hub.sessions > 0 ? Math.round(hub.tokens / hub.sessions / 1000) : 0;

    cardsHtml += `
      <div class="card">
        <h2>${hubEmoji[name] || '📦'} Hub ${name.toUpperCase()}</h2>
        <div class="value" style="color:${hubColors[name]}">${hub.sessions}</div>
        <div class="delta">sessions</div>
        <table style="margin-top:12px;">
          <tr><td>Success rate</td><td><span class="${successRate >= 80 ? 'green' : successRate >= 50 ? 'yellow' : 'red'}">${successRate}%</span></td></tr>
          <tr><td>Gate pass rate</td><td><span class="${gateRate >= 80 ? 'green' : 'yellow'}">${gateRate || '—'}%</span></td></tr>
          <tr><td>Avg tokens/session</td><td>${avgTokens}K</td></tr>
          <tr><td>Total tokens</td><td>${Math.round(hub.tokens/1000)}K</td></tr>
        </table>
      </div>`;
  }
  document.getElementById('hub-cards').innerHTML = cardsHtml;

  let agentRows = '';
  for (const [name, agent] of Object.entries(data.agents || {})) {
    const efficiency = agent.tasks > 0 ? Math.round(((agent.tasks - agent.errors) / agent.tasks) * 100) : 100;
    const badgeClass = efficiency >= 90 ? 'badge-green' : efficiency >= 70 ? 'badge-yellow' : 'badge-red';
    agentRows += `
      <tr>
        <td><strong>${name}</strong></td>
        <td>${agent.hub || '—'}</td>
        <td>${agent.tasks}</td>
        <td>${Math.round(agent.tokens/1000)}K</td>
        <td>${agent.errors}</td>
        <td><span class="badge ${badgeClass}">${efficiency}%</span></td>
      </tr>`;
  }
  document.getElementById('agent-table').innerHTML = agentRows || '<tr><td colspan="6" style="color:#64748b;">No agent data yet. Run a Hub task to generate.</td></tr>';

  let learningsHtml = '';
  for (const [hub, items] of Object.entries(data.learnings || {})) {
    if (items.length > 0) {
      learningsHtml += `<div style="margin-bottom:8px;"><strong class="${hub === 'build' ? 'blue' : hub === 'quality' ? 'green' : 'purple'}">${hub.toUpperCase()}</strong></div>`;
      for (const item of items.slice(-3)) {
        learningsHtml += `<div style="color:#94a3b8;margin-bottom:4px;">• ${item.error} <span style="color:#475569;">(${item.task})</span></div>`;
      }
    }
  }
  document.getElementById('learnings').innerHTML = learningsHtml || '<div style="color:#64748b;">No learnings yet. Complete a Hub pipeline to start learning.</div>';
}

function renderEmpty() {
  document.getElementById('timestamp').textContent = new Date().toLocaleString('es-PE');
  document.getElementById('hub-cards').innerHTML = ['build','quality','ops'].map(h =>
    `<div class="card"><h2>${h.toUpperCase()}</h2><div class="value" style="color:#475569;">0</div><div class="delta">awaiting first run</div></div>`
  ).join('');
}

loadData();
</script>
</body>
</html>
