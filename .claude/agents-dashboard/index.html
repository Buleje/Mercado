<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bodega San Martín — Agent Town</title>
    <style>
      :root {
        --bg: #0b0e1a;
        --bg-2: #131833;
        --panel: #1a2142;
        --border: #2b355e;
        --text: #e6edf3;
        --muted: #8b93c7;
        --primary: #00b4a6;
        --secondary: #f97316;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", "Consolas", ui-monospace, monospace;
        overflow: hidden;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* HUD overlay */
      .hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        pointer-events: none;
        z-index: 10;
        font-family: "Courier New", monospace;
      }
      .hud-left, .hud-right {
        background: rgba(10, 14, 26, 0.75);
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        backdrop-filter: blur(4px);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
      }
      .hud-left {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--primary);
        text-shadow: 2px 2px 0 #000;
      }
      .subtitle {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .hud-right {
        display: flex;
        gap: 16px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .stat { display: flex; flex-direction: column; align-items: center; }
      .stat .n {
        font-size: 16px;
        font-weight: 700;
        color: var(--secondary);
        text-shadow: 2px 2px 0 #000;
      }
      .stat .l {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
      }

      /* Tooltip pixel-art */
      .tooltip {
        position: fixed;
        pointer-events: none;
        background: #000;
        border: 2px solid var(--primary);
        padding: 6px 10px;
        font-family: "Courier New", monospace;
        font-size: 11px;
        color: var(--text);
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
        z-index: 20;
        display: none;
        max-width: 240px;
        image-rendering: pixelated;
      }
      .tooltip.show { display: block; }
      .tooltip .tt-name {
        color: var(--primary);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: 2px;
      }
      .tooltip .tt-role {
        color: var(--secondary);
        font-size: 9px;
        text-transform: uppercase;
      }
      .tooltip .tt-status {
        margin-top: 4px;
        font-size: 9px;
        color: var(--muted);
      }

      /* Action bar */
      .actions {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
      }
      .btn {
        font-family: "Courier New", monospace;
        font-size: 11px;
        padding: 8px 14px;
        background: #000;
        color: var(--primary);
        border: 2px solid var(--primary);
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
      }
      .btn.secondary {
        color: var(--secondary);
        border-color: var(--secondary);
      }

      /* Loading */
      .loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--primary);
        font-size: 14px;
        font-family: "Courier New", monospace;
        letter-spacing: 0.1em;
        z-index: 100;
      }
      .loading.hide { display: none; }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">CARGANDO PIXEL AGENTS...</div>

    <div id="game"></div>

    <div class="hud">
      <div class="hud-left">
        <div class="title">⚙ BODEGA SAN MARTÍN · AGENT HQ</div>
        <div class="subtitle">19 agentes en sus oficinas · lanzá un agent team al centro · clic en un agente para info</div>
      </div>
      <div class="hud-right">
        <div class="stat">
          <div class="n" id="stat-total">19</div>
          <div class="l">Agentes</div>
        </div>
        <div class="stat">
          <div class="n" id="stat-working">0</div>
          <div class="l">Trabajando</div>
        </div>
        <div class="stat">
          <div class="n" id="stat-tasks">0</div>
          <div class="l">Tareas</div>
        </div>
        <div class="stat">
          <div class="n" id="clock">--:--</div>
          <div class="l">PE</div>
        </div>
      </div>
    </div>

    <div class="tooltip" id="tooltip">
      <div class="tt-name"></div>
      <div class="tt-role"></div>
      <div class="tt-status"></div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-assign">🚀 LANZAR AGENT TEAM</button>
      <button class="btn secondary" id="btn-reset">↩ VOLVER A OFICINAS</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script type="module" src="./game.js"></script>
  </body>
</html>
