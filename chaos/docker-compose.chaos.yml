version: '3.8'

# ═══════════════════════════════════════════════════════════════════════
# Chaos Engineering Infrastructure — SOLO STAGING
#
# Usa Toxiproxy para simular fallos en servicios externos.
# NUNCA ejecutar contra producción.
#
# Uso:
#   docker compose -f chaos/docker-compose.chaos.yml up -d
#   # Configurar proxies via API
#   curl -X POST localhost:8474/proxies -d '{"name":"redis","listen":"0.0.0.0:6380","upstream":"redis:6379"}'
#
# Referencia: ADR-040
# ═══════════════════════════════════════════════════════════════════════

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474"   # Toxiproxy API
      - "6380:6380"   # Redis proxy
      - "5433:5433"   # PostgreSQL proxy
      - "8081:8081"   # External API proxy (Twilio, Stripe, SUNAT)
    environment:
      - LOG_LEVEL=info
    volumes:
      - ./toxiproxy-config.json:/config/toxiproxy.json
    networks:
      - chaos-net

networks:
  chaos-net:
    driver: bridge
